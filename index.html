<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John+fckinwi=❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;

      background-color: #d82b98;
      background-image: url("background.jpg");
      background-size: min(92vw, 900px) auto;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(50, 0, 35, 0.08), rgba(20, 0, 25, 0.36));
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 980px;
      background: rgba(34, 0, 28, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 32px;
      padding: 30px;
      box-shadow: 0 24px 95px rgba(0,0,0,0.42);
    }

    .formula {
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 900;
      margin-bottom: 12px;
      text-shadow: 0 0 24px rgba(255,255,255,0.35);
    }

    .badge {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 13px;
      margin-bottom: 13px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 56px);
      margin: 0 0 8px;
      line-height: 1;
      letter-spacing: -1px;
    }

    .subtitle {
      opacity: 0.92;
      margin: 0 auto 26px;
      line-height: 1.45;
      max-width: 720px;
      font-size: 17px;
    }

    .profiles {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 18px;
      align-items: center;
      margin: 24px 0;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 14px 45px rgba(0,0,0,0.22);
    }

    .profile-card img {
      width: 100%;
      height: 360px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      display: block;
    }

    .name {
      margin-top: 13px;
      font-weight: 900;
      font-size: clamp(23px, 4vw, 36px);
      letter-spacing: -0.5px;
    }

    .plus {
      font-size: clamp(38px, 7vw, 70px);
      font-weight: 900;
      animation: pulse 1.15s infinite;
      text-shadow: 0 0 26px rgba(255,255,255,0.45);
    }

    button {
      border: none;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #b00078;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 5px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
    }

    button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 36px rgba(0,0,0,0.28);
    }

    .progress-wrap {
      margin: 26px auto 12px;
      width: 100%;
      max-width: 720px;
      background: rgba(255,255,255,0.22);
      border-radius: 999px;
      overflow: hidden;
      height: 20px;
      display: none;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, white, #ffd2ef);
      border-radius: 999px;
      transition: width 0.75s ease;
    }

    .status {
      min-height: 28px;
      opacity: 0.95;
      margin-top: 14px;
      font-size: 15px;
    }

    .result {
      display: none;
      margin-top: 24px;
      animation: appear 0.8s ease forwards;
    }

    .percent {
      font-size: clamp(62px, 16vw, 106px);
      font-weight: 900;
      margin: 4px 0;
      text-shadow: 0 0 28px rgba(255,255,255,0.55);
    }

    .result p {
      line-height: 1.45;
      margin: 0 auto;
      max-width: 720px;
      font-size: 17px;
    }

    .choices {
      display: none;
      margin-top: 22px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .choices button {
      font-size: 14px;
      padding: 12px 15px;
    }

    .small {
      font-size: 13px;
      opacity: 0.82;
      margin-top: 24px;
      line-height: 1.4;
      display: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.84; }
      50% { transform: scale(1.18); opacity: 1; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .card {
        padding: 22px 14px;
        border-radius: 26px;
      }

      .profiles {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .plus {
        line-height: 0.8;
      }

      .profile-card img {
        height: 310px;
      }
    }

    @media (max-width: 430px) {
      .profile-card img {
        height: 250px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="formula">John+fckinwi=❤️</div>
    <div class="badge">Laboratoire des nouvelles connexions inwi</div>
    <h1>LovyDovy Connection Test</h1>
    <p class="subtitle">
      Le seul test qui ose calculer l'amour.
    </p>

    <div class="profiles">
      <div class="profile-card">
        <img src="fkinwi-full.jpg" alt="Profil F**KINWI">
        <div class="name">F**KINWI</div>
      </div>

      <div class="plus">+</div>

      <div class="profile-card">
        <img src="john-full.jpg" alt="Profil John">
        <div class="name">John</div>
      </div>
    </div>

    <button onclick="startTest()">Calcul de l'amour</button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress" id="progress"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div>Connexion détectée :</div>
      <div class="percent">100000%</div>
      <p>
        Signal beaucoup trop fort pour être ignoré. Le test recommande d’arrêter
        de blâmer le réseau et d'envoyer un 😘 à Jean Colborne.
      </p>
    </div>

    <div class="choices" id="choices">
      <button onclick="reply('yes')">J’assume le 100000%</button>
      <button onclick="reply('proof')">Demander une contre-expertise</button>
      <button onclick="reply('no')">Faire semblant que je n’ai rien vu</button>
    </div>

    <p class="small" id="footer"></p>
  </main>

  <script>
    const statuses = [
      "Recherche du signal...",
      "Connexion à inwi LovyDovy...",
      "Analyse des regards qui durent une seconde de trop...",
      "Vérification des cœurs...",
      "Détection d’une tension très officiellement non déclarée...",
      "Calcul du risque d'enfants...",
      "Connexion..."
    ];

    function startTest() {
      const progressWrap = document.getElementById("progressWrap");
      const progress = document.getElementById("progress");
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const choices = document.getElementById("choices");
      const footer = document.getElementById("footer");

      progressWrap.style.display = "block";
      result.style.display = "none";
      choices.style.display = "none";
      footer.style.display = "none";

      let i = 0;
      progress.style.width = "0%";
      status.textContent = "";

      const interval = setInterval(() => {
        const progressPercent = Math.min(((i + 1) / statuses.length) * 100, 100);

        progress.style.width = progressPercent + "%";
        status.textContent = statuses[i];

        i++;

        if (i >= statuses.length) {
          clearInterval(interval);

          setTimeout(() => {
            status.textContent = "Résultat validé par le département de l'amour";
            result.style.display = "block";
            choices.style.display = "flex";
          }, 1500);
        }
      }, 1800);
    }

    function reply(choice) {
      const footer = document.getElementById("footer");
      footer.style.display = "block";

      if (choice === "yes") {
        footer.textContent = "Connexion assumée. Prochaine étape recommandée : mariage, enfants, etc.";
      }

      if (choice === "proof") {
        footer.textContent = "Contre-expertise : le site vient de refaire le calcul et il insiste. C’est gênant pour tout le monde.";
      }

      if (choice === "no") {
        footer.textContent = "Arrête-euh";
      }
    }
  </script>
</body>
</html>
