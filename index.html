<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John+fckinwi=❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      height: 100dvh;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;

      background-color: #d82b98;
      background-image: url("background.jpg");
      background-size: min(92vw, 900px) auto;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(50, 0, 35, 0.08), rgba(20, 0, 25, 0.36));
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 980px);
      height: calc(100dvh - 16px);
      max-height: calc(100dvh - 16px);
      overflow: hidden;

      background: rgba(34, 0, 28, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 26px;
      padding: clamp(8px, 1.8dvh, 22px);
      box-shadow: 0 24px 95px rgba(0,0,0,0.42);

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(4px, 0.8dvh, 10px);
    }

    .formula {
      font-size: clamp(18px, 4.2dvh, 40px);
      font-weight: 900;
      margin: 0;
      text-shadow: 0 0 24px rgba(255,255,255,0.35);
      flex: 0 0 auto;
    }

    .badge {
      display: inline-block;
      width: fit-content;
      align-self: center;
      padding: clamp(4px, 0.8dvh, 7px) 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: clamp(10px, 1.7dvh, 13px);
      flex: 0 0 auto;
    }

    h1 {
      font-size: clamp(22px, 5dvh, 52px);
      margin: 0;
      line-height: 1;
      letter-spacing: -1px;
      flex: 0 0 auto;
    }

    .subtitle {
      opacity: 0.92;
      margin: 0 auto;
      line-height: 1.2;
      max-width: 720px;
      font-size: clamp(12px, 1.9dvh, 16px);
      flex: 0 0 auto;
    }

    .profiles {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: clamp(6px, 1.6vw, 18px);
      align-items: center;
      margin: clamp(4px, 0.8dvh, 10px) 0;
      min-height: 0;
      flex: 1 1 auto;
    }

    .profile-card {
      min-width: 0;
      height: 100%;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: clamp(5px, 1dvh, 10px);
      box-shadow: 0 14px 45px rgba(0,0,0,0.22);

      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .profile-card img {
      width: 100%;
      height: min(32dvh, 310px);
      object-fit: contain;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 13px;
      display: block;
      min-height: 0;
    }

    .name {
      margin-top: clamp(4px, 0.9dvh, 8px);
      font-weight: 900;
      font-size: clamp(15px, 3dvh, 30px);
      letter-spacing: -0.5px;
      flex: 0 0 auto;
    }

    .plus {
      font-size: clamp(28px, 6dvh, 62px);
      font-weight: 900;
      animation: pulse 1.15s infinite;
      text-shadow: 0 0 26px rgba(255,255,255,0.45);
      line-height: 1;
    }

    button {
      border: none;
      padding: clamp(9px, 1.6dvh, 14px) clamp(14px, 2.5dvh, 22px);
      border-radius: 999px;
      font-size: clamp(13px, 1.9dvh, 16px);
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #b00078;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 3px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
      flex: 0 0 auto;
    }

    button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 36px rgba(0,0,0,0.28);
    }

    .progress-wrap {
      margin: clamp(6px, 1.2dvh, 14px) auto 4px;
      width: 100%;
      max-width: 720px;
      background: rgba(255,255,255,0.22);
      border-radius: 999px;
      overflow: hidden;
      height: clamp(12px, 2dvh, 20px);
      display: none;
      flex: 0 0 auto;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, white, #ffd2ef);
      border-radius: 999px;
      transition: width 0.75s ease;
    }

    .status {
      min-height: clamp(18px, 2.6dvh, 28px);
      opacity: 0.95;
      margin-top: 2px;
      font-size: clamp(11px, 1.9dvh, 15px);
      flex: 0 0 auto;
    }

    .result {
      display: none;
      margin-top: clamp(4px, 0.8dvh, 10px);
      animation: appear 0.8s ease forwards;
      flex: 0 0 auto;
    }

    .percent {
      font-size: clamp(40px, 9dvh, 96px);
      font-weight: 900;
      margin: 0;
      line-height: 1;
      text-shadow: 0 0 28px rgba(255,255,255,0.55);
    }

    .result p {
      line-height: 1.22;
      margin: 2px auto 0;
      max-width: 720px;
      font-size: clamp(11px, 1.85dvh, 16px);
    }

    .choices {
      display: none;
      margin-top: clamp(4px, 0.8dvh, 10px);
      flex-wrap: wrap;
      justify-content: center;
      flex: 0 0 auto;
    }

    .choices button {
      font-size: clamp(11px, 1.7dvh, 14px);
      padding: clamp(8px, 1.3dvh, 12px) clamp(10px, 1.8dvh, 15px);
    }

    .small {
      font-size: clamp(10px, 1.7dvh, 13px);
      opacity: 0.82;
      margin: clamp(4px, 0.8dvh, 10px) 0 0;
      line-height: 1.25;
      display: none;
      flex: 0 0 auto;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.84; }
      50% { transform: scale(1.18); opacity: 1; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      body {
        padding: 5px;
      }

      .card {
        width: 100%;
        height: calc(100dvh - 10px);
        max-height: calc(100dvh - 10px);
        border-radius: 18px;
        padding: 8px;
        gap: 4px;
      }

      .profiles {
        grid-template-columns: 1fr auto 1fr;
        gap: 5px;
        margin: 4px 0;
      }

      .profile-card {
        padding: 5px;
        border-radius: 12px;
      }

      .profile-card img {
        height: min(23dvh, 190px);
        border-radius: 10px;
      }

      .plus {
        font-size: clamp(22px, 5dvh, 42px);
      }

      .name {
        font-size: clamp(12px, 2.5dvh, 20px);
        margin-top: 4px;
      }

      .percent {
        font-size: clamp(34px, 7dvh, 64px);
      }

      .result p {
        font-size: clamp(10px, 1.65dvh, 13px);
      }
    }

    @media (max-height: 650px) {
      .profile-card img {
        height: min(22dvh, 190px);
      }

      .formula {
        font-size: clamp(16px, 3.5dvh, 30px);
      }

      h1 {
        font-size: clamp(20px, 4.2dvh, 38px);
      }

      .subtitle {
        font-size: clamp(11px, 1.7dvh, 14px);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="formula">John+fckinwi=❤️</div>
    <div class="badge">Laboratoire des nouvelles connexions inwi</div>
    <h1>LovyDovy Connection Test</h1>
    <p class="subtitle">
      Le seul test qui ose calculer l'amour.
    </p>

    <div class="profiles">
      <div class="profile-card">
        <img src="fkinwi-full.jpg" alt="Profil F**KINWI">
        <div class="name">F**KINWI</div>
      </div>

      <div class="plus">+</div>

      <div class="profile-card">
        <img src="john-full.jpg" alt="Profil John">
        <div class="name">John</div>
      </div>
    </div>

    <button onclick="startTest()">Calcul de l'amour</button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress" id="progress"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div>Connexion détectée :</div>
      <div class="percent">100000%</div>
      <p>
        Signal beaucoup trop fort pour être ignoré. Le test recommande d’arrêter
        de blâmer le réseau et d'envoyer un 😘 à Jean Colborne.
      </p>
    </div>

    <div class="choices" id="choices">
      <button onclick="reply('yes')">J’assume le 100000%</button>
      <button onclick="reply('proof')">Demander une contre-expertise</button>
      <button onclick="reply('no')">Faire semblant que je n’ai rien vu</button>
    </div>

    <p class="small" id="footer"></p>
  </main>

  <script>
    const statuses = [
      "Recherche du signal...",
      "Connexion à inwi LovyDovy...",
      "Analyse des regards qui durent une seconde de trop...",
      "Vérification des cœurs...",
      "Détection d’une tension très officiellement non déclarée...",
      "Calcul du risque d'enfants...",
      "Connexion..."
    ];

    function startTest() {
      const progressWrap = document.getElementById("progressWrap");
      const progress = document.getElementById("progress");
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const choices = document.getElementById("choices");
      const footer = document.getElementById("footer");

      progressWrap.style.display = "block";
      result.style.display = "none";
      choices.style.display = "none";
      footer.style.display = "none";

      let i = 0;
      progress.style.width = "0%";
      status.textContent = "";

      const interval = setInterval(() => {
        const progressPercent = Math.min(((i + 1) / statuses.length) * 100, 100);

        progress.style.width = progressPercent + "%";
        status.textContent = statuses[i];

        i++;

        if (i >= statuses.length) {
          clearInterval(interval);

          setTimeout(() => {
            status.textContent = "Résultat validé par le département de l'amour";
            result.style.display = "block";
            choices.style.display = "flex";
          }, 1500);
        }
      }, 1800);
    }

    function reply(choice) {
      const footer = document.getElementById("footer");
      footer.style.display = "block";

      if (choice === "yes") {
        footer.textContent = "Connexion assumée. Prochaine étape recommandée : mariage, enfants, etc.";
      }

      if (choice === "proof") {
        footer.textContent = "Contre-expertise : le site vient de refaire le calcul et il insiste. C’est gênant pour tout le monde.";
      }

      if (choice === "no") {
        footer.textContent = "Arrête-euh";
      }
    }
  </script>
</body>
</html>
